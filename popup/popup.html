<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>English Helper</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0e0e10; --surface: #1a1a1e; --border: #2a2a30;
      --gold: #ffd97a; --gold-dim: rgba(255,217,122,0.12);
      --text: #f0ede6; --muted: #7a7870; --danger: #e05a5a;
    }
    body { width: 320px; min-height: 380px; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; }
    .header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--gold); }
    .logo-sub { color: var(--muted); font-size: 11px; font-family: 'DM Sans', sans-serif; margin-left: 6px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .toggle-label { color: var(--muted); font-size: 13px; }
    .switch { position: relative; width: 40px; height: 22px; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 11px; transition: background .2s; }
    .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--muted); border-radius: 50%; transition: transform .2s, background .2s; }
    .switch input:checked + .slider { background: rgba(255,217,122,.2); }
    .switch input:checked + .slider:before { transform: translateX(18px); background: var(--gold); }
    .section-title { padding: 12px 20px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    #sentence-list { max-height: 240px; overflow-y: auto; padding: 0 12px 8px; }
    #sentence-list::-webkit-scrollbar { width: 3px; }
    #sentence-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sentence-item { padding: 9px 12px; margin-bottom: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; position: relative; transition: border-color .15s; }
    .sentence-item:hover { border-color: rgba(255,217,122,.3); }
    .sentence-en { font-size: 13px; color: var(--text); line-height: 1.5; padding-right: 20px; }
    .sentence-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .src-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(255,217,122,.1); color: var(--gold); border: 1px solid rgba(255,217,122,.2); }
    .btn-del { position: absolute; top: 7px; right: 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; opacity: 0; transition: opacity .15s, color .15s; line-height: 1; }
    .sentence-item:hover .btn-del { opacity: 1; }
    .btn-del:hover { color: var(--danger); }
    .empty { padding: 28px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .count-badge { font-size: 11px; color: var(--gold); background: var(--gold-dim); border-radius: 10px; padding: 1px 7px; }
    .firebase-notice { margin: 6px 12px 12px; padding: 10px 13px; background: var(--gold-dim); border: 1px solid rgba(255,217,122,.2); border-radius: 8px; font-size: 12px; color: rgba(255,217,122,.8); line-height: 1.6; }
    .firebase-notice strong { display: block; margin-bottom: 2px; color: var(--gold); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">EnglishHelper<span class="logo-sub">Beta</span></div>
    <span id="count-badge" class="count-badge" style="display:none"></span>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">자막 오버레이</span>
    <label class="switch">
      <input type="checkbox" id="toggle-overlay" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;">
    <div class="section-title">저장한 문장</div>
  </div>
  <div id="sentence-list"><div class="empty">불러오는 중...</div></div>
  <div class="firebase-notice">
    <strong>☁ 곧 클라우드 동기화 예정</strong>
    Firebase 연동 후 모바일 앱과 자동으로 연동됩니다.
  </div>
  <script src="popup.js"></script>
</body>
</html>
